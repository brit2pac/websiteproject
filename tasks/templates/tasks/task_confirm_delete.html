{% extends "base.html" %}

{% block title %}Delete task | IT Task Manager{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 650px;">
    <a href="{% url 'task-detail' task.pk %}" class="text-decoration-none">
        &larr; Back to task
    </a>
    <div class="card border-0 shadow-sm mt-4">
        <div class="card-body p-4 p-md-5 text-center">
            <span class="badge text-bg-danger fs-6 mb-3">Delete task</span>
            <h1 class="h3 fw-bold mb-3">Are you sure?</h1>
            <p class="text-secondary mb-4">You are about to delete <strong class="text-dark">{{ task.name }}</strong>. This action cannot be undone.</p>
            <form method="post" class="d-flex justify-content-center gap-2 flex-wrap">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, delete</button>
                <a href="{% url 'task-detail' task.pk %}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
