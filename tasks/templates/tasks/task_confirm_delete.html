
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete task | IT Task Manager</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 650px;">
        <a href="{% url 'task-list' %}" class="text-decoration-none">
            &larr; Back to tasks
        </a>

        <div class="card border-0 shadow-sm mt-4">
            <div class="card-body p-4 p-md-5 text-center">
                <div class="mb-3">
                    <span class="badge text-bg-danger fs-6">Delete task</span>
                </div>

                <h1 class="h3 fw-bold mb-3">Are you sure?</h1>

                <p class="text-secondary mb-4">
                    You are about to delete the task
                    <strong class="text-dark">{{ task.name }}</strong>.
                    This action cannot be undone.
                </p>

                <form method="post" class="d-flex justify-content-center gap-2 flex-wrap">
                    {% csrf_token %}

                    <button type="submit" class="btn btn-danger">
                        Yes, delete
                    </button>

                    <a href="{% url 'task-list' %}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
