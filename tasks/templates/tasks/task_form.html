

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if task %}Edit task{% else %}Create task{% endif %} | IT Task Manager</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 800px;">
        <div class="mb-4">
            <a href="{% url 'task-list' %}" class="text-decoration-none">
                &larr; Back to tasks
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                {% if task %}
                    <h1 class="h3 fw-bold mb-2">Edit task</h1>
                    <p class="text-secondary mb-4">Update the task details below.</p>
                {% else %}
                    <h1 class="h3 fw-bold mb-2">Create task</h1>
                    <p class="text-secondary mb-4">Add a new task for your team.</p>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="name" class="form-label">Task name</label>
                        <input
                            id="name"
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ task.name|default:'' }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea
                            id="description"
                            name="description"
                            class="form-control"
                            rows="4"
                        >{{ task.description|default:'' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="deadline" class="form-label">Deadline</label>
                        <input
                            id="deadline"
                            type="date"
                            name="deadline"
                            class="form-control"
                            value="{{ task.deadline|date:'Y-m-d'|default:'' }}"
                        >
                    </div>

                    <div class="mb-3">
                        <label for="priority" class="form-label">Priority</label>
                        <select id="priority" name="priority" class="form-select">
                            {% for value, label in priorities %}
                                <option
                                    value="{{ value }}"
                                    {% if task and task.priority == value %}selected{% elif not task and value == 'medium' %}selected{% endif %}
                                >
                                    {{ label }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="task_type" class="form-label">Task type</label>
                        <select id="task_type" name="task_type" class="form-select" required>
                            <option value="">Choose a type</option>
                            {% for task_type in task_types %}
                                <option
                                    value="{{ task_type.id }}"
                                    {% if task and task.task_type_id == task_type.id %}selected{% endif %}
                                >
                                    {{ task_type.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="assignees" class="form-label">Assignees</label>
                        <select id="assignees" name="assignees" class="form-select" multiple>
                            {% for worker in workers %}
                                <option
                                    value="{{ worker.id }}"
                                    {% if task and worker in task.assignees.all %}selected{% endif %}
                                >
                                    {{ worker.username }}
                                </option>
                            {% endfor %}
                        </select>
                        <div class="form-text">Hold Command (Mac) or Ctrl (Windows) to select multiple people.</div>
                    </div>

                    <div class="d-flex flex-wrap gap-2">
                        {% if task %}
                            <button type="submit" class="btn btn-primary">
                                Save changes
                            </button>
                        {% else %}
                            <button type="submit" class="btn btn-primary">
                                Create task
                            </button>
                        {% endif %}

                        <a href="{% url 'task-list' %}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
