{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <a href="{% url 'task-type-list' %}" class="btn btn-outline-secondary mb-4">
        &larr; Back to task types
    </a>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h1 class="h3 fw-bold mb-3">
                {{ task_type.name }}
            </h1>

            <h2 class="h5 fw-bold mt-4 mb-3">
                Tasks of this type
            </h2>

            {% if tasks %}
            <div class="list-group">
                {% for task in tasks %}
                <a href="{% url 'task-detail' task.pk %}" class="list-group-item list-group-item-action">
                    <span class="fw-semibold">
                        {{ task.name }}
                    </span>

                    <span class="text-secondary">
                        — {{ task.get_priority_display }}
                    </span>
                </a>
                {% endfor %}
            </div>
            {% else %}
            <p class="text-secondary mb-0">
                No tasks of this type yet.
            </p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
