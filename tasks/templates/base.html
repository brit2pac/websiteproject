
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IT Task Manager{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark" href="{% url 'task-list' %}">
                IT Task Manager
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navigation" aria-controls="main-navigation" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="main-navigation">
            <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                {% if user.is_authenticated %}
                    <a class="nav-link text-secondary" href="{% url 'task-list' %}">
                        Tasks
                    </a>
                    <a class="nav-link text-secondary" href="{% url 'worker-list' %}">
                        Workers
                    </a>
                    <a class="nav-link text-secondary" href="{% url 'position-list' %}">
                        Positions
                    </a>
                    <a class="nav-link text-secondary" href="{% url 'task-type-list' %}">
                        Task Types
                    </a>
                    <form method="post" action="{% url 'logout' %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-secondary btn-sm">
                            Log out
                        </button>
                    </form>
                {% else %}
                    <a class="btn btn-primary btn-sm" href="{% url 'login' %}">
                        Sign in
                    </a>
                {% endif %}
            </div>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
</body>
</html>
