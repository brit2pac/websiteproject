{% extends "base.html" %}

{% block title %}Sign in | IT Task Manager{% endblock %}

{% block content %}
<div class="min-vh-75 d-flex align-items-center justify-content-center py-5">
    <div class="card border-0 shadow-sm w-100" style="max-width: 440px;">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 fw-bold mb-2">Welcome back</h1>
            <p class="text-secondary mb-4">Sign in to manage your team's tasks.</p>

            {% if form.errors %}
                <div class="alert alert-danger" role="alert">Your username or password is incorrect.</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-3">
                    <label for="id_username" class="form-label">Username</label>
                    <input type="text" name="username" id="id_username" class="form-control" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="id_password" class="form-label">Password</label>
                    <input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
